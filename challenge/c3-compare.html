<title>TikTok表示イメージ</title>
<style>
:root{--bg:#111; --ink:#eee; --muted:#9a9a9a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eceae4; --ink:#1d1a14; --muted:#6b6352}}
:root[data-theme="light"]{--bg:#eceae4; --ink:#1d1a14; --muted:#6b6352}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif; padding:0 16px}
.wrap{max-width:1240px; margin:0 auto; padding:24px 0 48px}
h1{font-size:1.4rem; margin:0} .lead{color:var(--muted); margin:.4em 0 20px; font-size:.9rem; line-height:1.7}
.grid{display:flex; flex-wrap:wrap; gap:22px; justify-content:center}
.ph{margin:0; width:280px}
.scr{position:relative; width:280px; aspect-ratio:9/19.5; border-radius:30px; overflow:hidden; background:#000; border:6px solid #222; box-shadow:0 10px 30px rgba(0,0,0,.35); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; color:#fff}
.cr{position:absolute; left:0; right:0; top:0; width:100%; height:calc(100% - 44px); object-fit:cover}
.top{position:absolute; top:22px; left:0; right:0; display:flex; justify-content:center; gap:14px; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.6)}
.top span{opacity:.7} .top b{border-bottom:2px solid #fff; padding-bottom:2px} .top i{position:absolute; right:12px; font-style:normal}
.rail{position:absolute; right:6px; bottom:150px; display:flex; flex-direction:column; align-items:center; gap:12px}
.rail > div{display:flex; flex-direction:column; align-items:center}
.rail svg{width:28px; height:28px; fill:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.rail small{font-size:9px; margin-top:1px; text-shadow:0 1px 2px #000}
.av{position:relative; width:38px; height:38px; border-radius:50%; background:#111; border:1.5px solid #fff; overflow:visible; margin-bottom:6px}
.av img{width:32px; height:auto; margin:13px auto 0; display:block}
.av em{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:#fe2c55; font-style:normal; font-size:11px; line-height:15px; text-align:center}
.cap{position:absolute; left:10px; right:56px; bottom:52px; text-shadow:0 1px 2px rgba(0,0,0,.7)}
.acct{margin:0 0 3px; font-weight:700; font-size:12.5px}
.txt{margin:0 0 4px; font-size:11px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.sp{margin:0 0 6px; font-size:9.5px; opacity:.85}
.btn{display:flex; justify-content:space-between; align-items:center; background:rgba(22,24,35,.55); backdrop-filter:blur(4px); border-radius:4px; padding:7px 10px; font-size:11.5px; font-weight:700; color:#fff; text-decoration:none}
.nav{position:absolute; left:0; right:0; bottom:0; height:44px; background:#000; display:flex; justify-content:space-around; align-items:center; font-size:8.5px; color:#ccc}
.nav b{background:#fff; color:#000; border-radius:6px; padding:1px 10px; font-size:14px; box-shadow:-3px 0 0 #25f4ee, 3px 0 0 #fe2c55}
figcaption{margin-top:10px; text-align:center; font-weight:700; font-size:14px}
figcaption b{display:inline-block; background:#e3b43a; color:#1a1200; border-radius:6px; padding:0 7px; margin-right:6px}
