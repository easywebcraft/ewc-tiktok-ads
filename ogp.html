<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+JP:wght@400;700;800;900&display=block">
<style>
/* 広告04（初期費用0円）を OGP 用の 1200x630 に組み直したもの。
   LINE・X などは中央付近を切り抜くことがあるので、重要な要素は中央 1100x560 に収める */
*{box-sizing:border-box; margin:0; padding:0}
body{width:1200px; height:630px; overflow:hidden; font-family:"Noto Sans JP",sans-serif; color:#fff;
  background:radial-gradient(50% 60% at 30% 50%, rgba(255,198,26,.12), transparent 70%), linear-gradient(160deg,#06142f 0%,#0b2a5c 55%,#0d3a7d 100%)}
.wrap{position:absolute; inset:0; display:flex; align-items:center; padding:0 70px; gap:40px}
.left{flex:0 0 470px; text-align:center}
.pill{display:inline-block; border:2px solid rgba(255,255,255,.5); border-radius:999px; padding:6px 24px; font-size:24px; font-weight:700}
.lbl{font-size:40px; font-weight:800; margin-top:18px}
.zero{font-family:"Montserrat",sans-serif; font-weight:900; font-size:230px; line-height:.9; color:#ffc61a; text-shadow:0 14px 44px rgba(255,198,26,.35)}
.zero small{font-family:"Noto Sans JP"; font-size:80px; color:#fff; margin-left:4px}
.mon{font-size:34px; font-weight:800; margin-top:14px}
.mon b{font-family:"Montserrat"; font-weight:900; font-size:62px; color:#ffc61a; margin:0 4px}
.right{flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:22px}
.right img{height:40px; width:auto}
.head{font-size:46px; font-weight:900; line-height:1.3; white-space:nowrap}
.head .y{color:#ffc61a}
.head small{font-size:32px; font-weight:800; color:#fff}
.head small .y{color:#ffc61a}
.free{display:inline-block; background:#fff; color:#0d3a7d; font-size:26px; font-weight:800; border-radius:16px; padding:12px 22px; white-space:nowrap}
.free b{color:#c8553d; font-size:36px; font-weight:900; margin-left:4px}
.note{font-size:18px; color:rgba(255,255,255,.72)}
</style></head><body>
<div class="wrap">
  <div class="left">
    <p class="pill">開業時の大きな出費を抑えて</p>
    <p class="lbl">初期費用</p>
    <p class="zero">0<small>円</small></p>
    <p class="mon">月額<b>5,980</b>円～</p>
  </div>
  <div class="right">
    <img src="img/logo-mark.webp" alt="EasyWebCraft">
    <p class="head"><small><span class="y">開業前</span>・<span class="y">開業したばかり</span>の方の</small><br><span class="y">ホームページ制作</span></p>
    <p class="free">トップページのデザイン案まで<b>無料</b></p>
    <p class="note">※価格は税別・最低契約期間6ヶ月</p>
  </div>
</div>
</body></html>
